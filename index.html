<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>sordfish's GitHub Repos</title>
  <style>
    body {
      font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif;
      margin: 2rem;
      max-width: 900px
    }

    ul {
      padding-left: 1rem
    }

    li {
      margin: .25rem 0
    }
  </style>
</head>

<body>
  <h1>sordfish’s public repositories</h1>
  <ul id="list"></ul>
  <script>
    (async () => {
      const user = "sordfish";  // hard-coded username
      const list = document.getElementById("list");
      try {
        const res = await fetch(`https://api.github.com/users/${user}/repos?per_page=100&sort=updated`);
        const data = await res.json();
        data.forEach(r => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = r.html_url; a.textContent = r.full_name;
          a.target = "_blank"; a.rel = "noopener";
          li.appendChild(a);
          if (r.description) { li.append(" — " + r.description); }
          list.appendChild(li);
        });
      } catch (e) { list.innerHTML = "<li>Failed to load repos.</li>"; }
    })();
  </script>
</body>

</html>
